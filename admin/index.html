<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Note — Admin</title>
  <link href="https://fonts.googleapis.com/css2?family=Nunito+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; background: #040000; font-family: 'Nunito Sans', sans-serif; color: #fff; overflow: hidden; }

    #loginScreen {
      position: fixed; inset: 0; background: #040000;
      display: flex; align-items: center; justify-content: center; z-index: 999;
    }
    .login-box {
      background: #0d0202; border: 1px solid rgba(232,25,44,0.2);
      border-radius: 20px; padding: 40px; width: 340px;
      box-shadow: 0 8px 48px rgba(0,0,0,0.6);
    }
    .login-logo {
      display: flex; align-items: center; gap: 10px;
      font-size: 20px; font-weight: 800; margin-bottom: 28px;
    }
    .login-logo-icon {
      width: 36px; height: 36px; border-radius: 10px;
      background: radial-gradient(circle at 40% 35%, #2a0008, #0d0002);
      border: 1px solid rgba(232,25,44,0.35);
      box-shadow: 0 0 12px rgba(232,25,44,0.4);
      display: flex; align-items: center; justify-content: center;
    }
    .login-logo-icon svg { width: 22px; height: 22px; }
    .login-title { font-size: 22px; font-weight: 800; margin-bottom: 6px; }
    .login-sub { font-size: 13px; color: rgba(255,255,255,0.4); margin-bottom: 24px; }
    .login-field { display: flex; flex-direction: column; gap: 6px; margin-bottom: 14px; }
    .login-field label { font-size: 12px; font-weight: 600; color: rgba(255,255,255,0.5); }
    .login-field input {
      background: rgba(255,255,255,0.05); border: 1px solid rgba(232,25,44,0.2);
      border-radius: 10px; padding: 11px 14px; color: #fff; font-size: 14px;
      outline: none; font-family: inherit; transition: border-color 0.15s;
    }
    .login-field input:focus { border-color: rgba(232,25,44,0.5); }
    .login-btn {
      width: 100%; padding: 12px; border-radius: 12px; border: none; cursor: pointer;
      background: linear-gradient(135deg, #e8192c, #8b0000); color: #fff;
      font-size: 15px; font-weight: 700; font-family: inherit;
      box-shadow: 0 4px 16px rgba(232,25,44,0.4); transition: opacity 0.15s;
      display: flex; align-items: center; justify-content: center; gap: 8px;
    }
    .login-btn:hover { opacity: 0.85; }
    .login-btn:disabled { opacity: 0.5; cursor: not-allowed; }
    .login-err { font-size: 13px; color: #ff4455; margin-top: 10px; display: none; }
    .spinner { width: 16px; height: 16px; border: 2px solid rgba(255,255,255,0.3); border-top-color: #fff; border-radius: 50%; animation: spin 0.7s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }

    #adminApp { display: none; height: 100vh; flex-direction: column; }
    .admin-layout { display: flex; flex: 1; min-height: 0; }

    .sidebar {
      width: 280px; flex-shrink: 0; background: #0a0101;
      border-right: 1px solid rgba(232,25,44,0.12);
      display: flex; flex-direction: column;
    }
    .sidebar-header {
      padding: 16px; border-bottom: 1px solid rgba(232,25,44,0.10);
      display: flex; align-items: center; gap: 10px;
    }
    .sidebar-logo {
      width: 30px; height: 30px; border-radius: 8px;
      background: radial-gradient(circle at 40% 35%, #2a0008, #0d0002);
      border: 1px solid rgba(232,25,44,0.35); box-shadow: 0 0 8px rgba(232,25,44,0.3);
      display: flex; align-items: center; justify-content: center; flex-shrink: 0;
    }
    .sidebar-logo svg { width: 18px; height: 18px; }
    .sidebar-title { font-size: 15px; font-weight: 800; }
    .sidebar-badge { font-size: 11px; color: rgba(255,255,255,0.35); }
    .sidebar-logout {
      margin-left: auto; background: none; border: 1px solid rgba(232,25,44,0.2);
      color: rgba(255,255,255,0.4); border-radius: 8px; padding: 5px 8px;
      font-size: 11px; cursor: pointer; transition: all 0.15s; font-family: inherit;
    }
    .sidebar-logout:hover { background: rgba(232,25,44,0.1); color: #fff; }

    .sessions-list { flex: 1; overflow-y: auto; padding: 8px; }
    .sessions-list::-webkit-scrollbar { width: 3px; }
    .sessions-list::-webkit-scrollbar-thumb { background: rgba(232,25,44,0.2); border-radius: 2px; }
    .session-item {
      padding: 12px; border-radius: 12px; cursor: pointer;
      transition: background 0.15s; margin-bottom: 4px;
      border: 1px solid transparent;
    }
    .session-item:hover { background: rgba(232,25,44,0.08); }
    .session-item.active { background: rgba(232,25,44,0.12); border-color: rgba(232,25,44,0.2); }
    .session-id { font-size: 12px; font-weight: 700; color: rgba(255,255,255,0.7); margin-bottom: 3px; }
    .session-preview { font-size: 12px; color: rgba(255,255,255,0.4); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .session-time { font-size: 11px; color: rgba(255,255,255,0.25); margin-top: 3px; }
    .unread-dot { display: inline-block; width: 7px; height: 7px; border-radius: 50%; background: #e8192c; margin-right: 5px; box-shadow: 0 0 6px rgba(232,25,44,0.6); }
    .no-sessions { padding: 24px 16px; font-size: 13px; color: rgba(255,255,255,0.3); text-align: center; }

    .chat-area { flex: 1; display: flex; flex-direction: column; min-width: 0; }
    .chat-top {
      padding: 14px 18px; background: #0a0101;
      border-bottom: 1px solid rgba(232,25,44,0.10);
      display: flex; align-items: center; gap: 12px; flex-shrink: 0;
    }
    .chat-top-avatar {
      width: 36px; height: 36px; border-radius: 50%;
      background: linear-gradient(135deg, #333, #111);
      display: flex; align-items: center; justify-content: center;
      font-size: 14px; font-weight: 700; flex-shrink: 0;
    }
    .chat-top-name { font-size: 14px; font-weight: 700; }
    .chat-top-id { font-size: 11px; color: rgba(255,255,255,0.3); margin-top: 1px; }

    .chat-msgs {
      flex: 1; overflow-y: auto; padding: 16px;
      display: flex; flex-direction: column; gap: 8px;
    }
    .chat-msgs::-webkit-scrollbar { width: 4px; }
    .chat-msgs::-webkit-scrollbar-thumb { background: rgba(232,25,44,0.2); border-radius: 2px; }

    .msg { display: flex; align-items: flex-end; gap: 8px; max-width: 75%; }
    .msg.from-user { align-self: flex-start; }
    .msg.from-admin { align-self: flex-end; flex-direction: row-reverse; }
    .msg-avatar {
      width: 26px; height: 26px; border-radius: 50%; flex-shrink: 0;
      background: #333; display: flex; align-items: center; justify-content: center;
      font-size: 11px; font-weight: 700;
    }
    .msg-bubble { padding: 9px 13px; border-radius: 16px; font-size: 14px; line-height: 1.5; }
    .msg.from-user .msg-bubble {
      background: #181010; border: 1px solid rgba(232,25,44,0.12);
      border-bottom-left-radius: 4px; color: rgba(255,255,255,0.88);
    }
    .msg.from-admin .msg-bubble {
      background: linear-gradient(135deg,#e8192c,#9b0010);
      border-bottom-right-radius: 4px; color: #fff;
      box-shadow: 0 2px 10px rgba(232,25,44,0.3);
    }
    .msg-time { font-size: 10px; color: rgba(255,255,255,0.25); margin-top: 2px; padding: 0 3px; }
    .msg.from-admin .msg-time { text-align: right; }

    .empty-state {
      flex: 1; display: flex; align-items: center; justify-content: center;
      flex-direction: column; gap: 12px; color: rgba(255,255,255,0.2);
    }
    .empty-icon { font-size: 48px; }
    .empty-text { font-size: 14px; }

    .reply-bar {
      padding: 12px 16px; background: #0a0101;
      border-top: 1px solid rgba(232,25,44,0.10);
      display: flex; align-items: flex-end; gap: 10px; flex-shrink: 0;
    }
    .reply-input {
      flex: 1; background: rgba(255,255,255,0.05); border: 1px solid rgba(232,25,44,0.18);
      border-radius: 20px; padding: 10px 16px; color: #fff; font-size: 14px;
      font-family: inherit; outline: none; resize: none; max-height: 120px; line-height: 1.5;
      transition: border-color 0.15s;
    }
    .reply-input::placeholder { color: rgba(255,255,255,0.25); }
    .reply-input:focus { border-color: rgba(232,25,44,0.4); }
    .reply-send {
      width: 40px; height: 40px; border-radius: 50%;
      background: linear-gradient(135deg,#e8192c,#8b0000); border: none; cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      box-shadow: 0 2px 10px rgba(232,25,44,0.35); transition: opacity 0.15s, transform 0.15s;
    }
    .reply-send:hover { opacity: 0.85; transform: scale(1.05); }
    .reply-send svg { width: 16px; height: 16px; color: #fff; }
  </style>
</head>
<body>

  <!-- LOGIN -->
  <div id="loginScreen">
    <div class="login-box">
      <div class="login-logo">
        <div class="login-logo-icon">
          <svg viewBox="0 0 20 22" fill="none"><defs><linearGradient id="ng" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#fff"/><stop offset="100%" stop-color="#ff8899"/></linearGradient></defs><text x="10" y="17" text-anchor="middle" font-size="20" fill="url(#ng)" font-family="Georgia,serif">𝄞</text></svg>
        </div>
        Note Admin
      </div>
      <p class="login-title">Sign in</p>
      <p class="login-sub">Access the support dashboard</p>
      <div class="login-field"><label>Email</label><input type="email" id="loginEmail" placeholder="your@email.com" /></div>
      <div class="login-field"><label>Password</label><input type="password" id="loginPass" placeholder="••••••••" /></div>
      <button class="login-btn" id="loginBtn" onclick="doLogin()">Sign in</button>
      <p class="login-err" id="loginErr">Wrong email or password</p>
    </div>
  </div>

  <!-- ADMIN APP -->
  <div id="adminApp">
    <div class="admin-layout">
      <div class="sidebar">
        <div class="sidebar-header">
          <div class="sidebar-logo">
            <svg viewBox="0 0 20 22" fill="none"><defs><linearGradient id="ng2" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#fff"/><stop offset="100%" stop-color="#ff8899"/></linearGradient></defs><text x="10" y="17" text-anchor="middle" font-size="20" fill="url(#ng2)" font-family="Georgia,serif">𝄞</text></svg>
          </div>
          <div>
            <div class="sidebar-title">Support</div>
            <div class="sidebar-badge">Admin Panel</div>
          </div>
          <button class="sidebar-logout" onclick="doLogout()">Sign out</button>
        </div>
        <div class="sessions-list" id="sessionsList">
          <div class="no-sessions">No conversations yet</div>
        </div>
      </div>

      <div class="chat-area" id="chatArea">
        <div class="empty-state">
          <div class="empty-icon">💬</div>
          <div class="empty-text">Select a conversation to reply</div>
        </div>
      </div>
    </div>
  </div>

  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
  <script>
    firebase.initializeApp({
      apiKey: "AIzaSyDlHPmsc1z0XVQ8XALZZAfuDAf04IfWKls",
      authDomain: "note-client-2017b.firebaseapp.com",
      databaseURL: "https://note-client-2017b-default-rtdb.firebaseio.com",
      projectId: "note-client-2017b",
      storageBucket: "note-client-2017b.firebasestorage.app",
      messagingSenderId: "387409651145",
      appId: "1:387409651145:web:c22642b42360ab25b77418"
    });
    const auth = firebase.auth();
    const db   = firebase.database();

    // Auto-login check
    auth.onAuthStateChanged(user => {
      if (user) {
        document.getElementById('loginScreen').style.display = 'none';
        document.getElementById('adminApp').style.display = 'flex';
        initAdmin();
      }
    });

    // Login
    document.getElementById('loginPass').addEventListener('keydown', e => { if(e.key==='Enter') doLogin(); });
    document.getElementById('loginEmail').addEventListener('keydown', e => { if(e.key==='Enter') document.getElementById('loginPass').focus(); });

    function doLogin() {
      const email = document.getElementById('loginEmail').value.trim();
      const pass  = document.getElementById('loginPass').value;
      const btn   = document.getElementById('loginBtn');
      const err   = document.getElementById('loginErr');
      err.style.display = 'none';
      btn.disabled = true;
      btn.innerHTML = '<div class="spinner"></div>';
      auth.signInWithEmailAndPassword(email, pass)
        .catch(() => {
          err.style.display = 'block';
          btn.disabled = false;
          btn.innerHTML = 'Sign in';
        });
    }

    function doLogout() {
      auth.signOut().then(() => location.reload());
    }

    let activeSession = null;
    const sessions = {};

    function initAdmin() {
      db.ref('chats').on('child_added', snap => {
        sessions[snap.key] = snap.val().info || {};
        renderSessions();
      });
      db.ref('chats').on('child_changed', snap => {
        sessions[snap.key] = snap.val().info || {};
        renderSessions();
        if (activeSession === snap.key) {
          // refresh unread badge only
        }
      });
    }

    function renderSessions() {
      const list = document.getElementById('sessionsList');
      const keys = Object.keys(sessions).sort((a,b) => (sessions[b].lastTime||0)-(sessions[a].lastTime||0));
      if (!keys.length) { list.innerHTML = '<div class="no-sessions">No conversations yet</div>'; return; }
      list.innerHTML = '';
      keys.forEach(sid => {
        const info = sessions[sid];
        const div  = document.createElement('div');
        div.className = 'session-item' + (activeSession===sid?' active':'');
        const shortId = sid.replace('session_','').split('_').pop() || sid.slice(-6);
        const time = info.lastTime ? new Date(info.lastTime).toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'}) : '';
        div.innerHTML = `
          <div class="session-id">${info.unread?'<span class="unread-dot"></span>':''}User #${shortId}</div>
          <div class="session-preview">${escHtml(info.lastMsg||'...')}</div>
          <div class="session-time">${time}</div>`;
        div.onclick = () => openSession(sid);
        list.appendChild(div);
      });
    }

    function openSession(sid) {
      activeSession = sid;
      renderSessions();
      db.ref('chats/'+sid+'/info/unread').set(false);

      const shortId = sid.replace('session_','').split('_').pop() || sid.slice(-6);
      const chatArea = document.getElementById('chatArea');
      chatArea.innerHTML = `
        <div class="chat-top">
          <div class="chat-top-avatar">U</div>
          <div>
            <div class="chat-top-name">User #${shortId}</div>
            <div class="chat-top-id">${sid}</div>
          </div>
        </div>
        <div class="chat-msgs" id="adminMsgs"></div>
        <div class="reply-bar">
          <textarea class="reply-input" id="replyInput" placeholder="Type your reply... (Enter to send)" rows="1"></textarea>
          <button class="reply-send" id="replySend">
            <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M14 8L2 2l3 6-3 6 12-6z"/></svg>
          </button>
        </div>`;

      const replyInput = document.getElementById('replyInput');
      document.getElementById('replySend').addEventListener('click', sendReply);
      replyInput.addEventListener('keydown', e => { if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();sendReply();} });
      replyInput.addEventListener('input', () => {
        replyInput.style.height = 'auto';
        replyInput.style.height = Math.min(replyInput.scrollHeight,120)+'px';
        db.ref('chats/'+sid+'/adminTyping').set(replyInput.value.length > 0);
      });

      const msgsEl = document.getElementById('adminMsgs');
      // Clear and re-listen
      db.ref('chats/'+sid+'/messages').off();
      db.ref('chats/'+sid+'/messages').on('child_added', snap => {
        const d = snap.val();
        const isAdmin = d.from === 'admin';
        const msg = document.createElement('div');
        msg.className = 'msg ' + (isAdmin ? 'from-admin' : 'from-user');
        const avatarStyle = isAdmin ? 'style="background:linear-gradient(135deg,#e8192c,#6b0010)"' : '';
        const avatarLetter = isAdmin ? 'A' : 'U';
        if (isAdmin) {
          msg.innerHTML = `<div class="msg-avatar" ${avatarStyle}>${avatarLetter}</div><div><div class="msg-bubble">${escHtml(d.text)}</div><div class="msg-time">${d.time||''}</div></div>`;
        } else {
          msg.innerHTML = `<div class="msg-avatar">${avatarLetter}</div><div><div class="msg-bubble">${escHtml(d.text)}</div><div class="msg-time">${d.time||''}</div></div>`;
        }
        msgsEl.appendChild(msg);
        msgsEl.scrollTop = msgsEl.scrollHeight;
      });
    }

    function sendReply() {
      if (!activeSession) return;
      const input = document.getElementById('replyInput');
      const text  = input.value.trim();
      if (!text) return;
      input.value = '';
      input.style.height = 'auto';
      db.ref('chats/'+activeSession+'/adminTyping').set(false);
      const now  = new Date();
      const time = now.getHours().toString().padStart(2,'0')+':'+now.getMinutes().toString().padStart(2,'0');
      db.ref('chats/'+activeSession+'/messages').push({ text, from:'admin', time, ts: Date.now() });
      db.ref('chats/'+activeSession+'/info').update({ lastMsg:'(you) '+text, lastTime: Date.now() });
    }

    function escHtml(t) {
      return String(t).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
    }
  </script>
</body>
</html>
