<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Note — Profile</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Nunito+Sans:wght@400;500;600;700;800;900&family=Josefin+Sans:wght@300;400&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      min-height: 100%; background: #040000;
      font-family: 'Nunito Sans', 'Segoe UI', system-ui, sans-serif; color: #fff;
    }

    /* ── NAV ── */
    nav {
      position: fixed; top: 16px; left: 50%; transform: translateX(-50%);
      z-index: 100; display: flex; align-items: center; padding: 5px 6px;
      background: rgba(8,2,2,0.88); border: 1px solid rgba(232,25,44,0.20);
      border-radius: 50px; backdrop-filter: blur(24px); white-space: nowrap;
      box-shadow: 0 2px 24px rgba(0,0,0,0.5), inset 0 1px 0 rgba(255,255,255,0.04); gap: 0;
    }
    .nav-logo {
      display: flex; align-items: center; gap: 8px;
      font-family: 'Josefin Sans', sans-serif; font-weight: 700; font-size: 15px; letter-spacing: 0.04em;
      text-decoration: none; padding: 3px 12px 3px 4px;
      background: linear-gradient(180deg, #fff 0%, #ff8899 100%);
      -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text;
    }
    .nav-logo-icon {
      width: 34px; height: 34px;
      background: radial-gradient(circle at 40% 35%, #2a0008 0%, #0d0002 100%);
      border-radius: 10px; display: flex; align-items: center; justify-content: center;
      flex-shrink: 0; border: 1px solid rgba(232,25,44,0.35);
      box-shadow: 0 0 12px rgba(232,25,44,0.5), 0 0 32px rgba(232,25,44,0.2);
      position: relative; overflow: hidden;
    }
    .nav-logo-icon::after { content:''; position:absolute; top:-8px; left:50%; transform:translateX(-50%); width:20px; height:20px; background:radial-gradient(circle,rgba(232,25,44,0.6),transparent 70%); pointer-events:none; }
    .nav-logo-icon svg { width:22px; height:22px; position:relative; z-index:1; }
    .nav-sep { width:1px; height:16px; background:rgba(232,25,44,0.20); margin:0 4px; flex-shrink:0; }
    .nav-links { display:flex; align-items:center; list-style:none; gap:1px; }
    .nav-links a { display:flex; align-items:center; gap:5px; padding:6px 11px; border-radius:50px; font-size:13px; font-weight:500; color:rgba(255,255,255,0.60); text-decoration:none; transition:background 0.15s,color 0.15s; line-height:1; }
    .nav-links a:hover { background:rgba(232,25,44,0.12); color:#fff; }
    .nav-links a .nav-icon { width:14px; height:14px; opacity:0.80; flex-shrink:0; }
    .nav-actions { display:flex; align-items:center; gap:5px; margin-left:2px; }
    .theme-toggle-pill { display:flex; align-items:center; background:rgba(232,25,44,0.08); border:1px solid rgba(232,25,44,0.16); border-radius:50px; padding:3px 4px; gap:1px; cursor:pointer; }
    .tog-icon { width:24px; height:24px; border-radius:50%; display:flex; align-items:center; justify-content:center; font-size:12px; color:rgba(255,255,255,0.35); transition:background 0.18s,color 0.18s; user-select:none; }
    .tog-icon.active { background:rgba(232,25,44,0.28); color:#fff; }
    .btn-user { display:flex; align-items:center; gap:7px; padding:5px 13px 5px 5px; border-radius:50px; background:rgba(232,25,44,0.12); border:1px solid rgba(232,25,44,0.22); cursor:pointer; color:#fff; font-size:13px; font-weight:600; transition:background 0.15s; text-decoration:none; line-height:1; }
    .btn-user:hover { background:rgba(232,25,44,0.22); }
    .user-initial-nav { width:24px; height:24px; border-radius:50%; background:linear-gradient(135deg,#e8192c,#6b0010); display:flex; align-items:center; justify-content:center; font-size:11px; font-weight:800; flex-shrink:0; overflow:hidden; }
    .user-initial-nav img { width:100%; height:100%; object-fit:cover; border-radius:50%; }

    /* ── LOADING ── */
    .loading-screen { position:fixed; inset:0; background:#040000; display:flex; align-items:center; justify-content:center; z-index:999; }
    .loading-spinner { width:36px; height:36px; border-radius:50%; border:3px solid rgba(232,25,44,0.2); border-top-color:#e8192c; animation:spin 0.7s linear infinite; }
    @keyframes spin { to{transform:rotate(360deg)} }

    /* ── PAGE LAYOUT ── */
    .profile-page { min-height:100vh; padding:110px 24px 80px; display:flex; flex-direction:column; align-items:center; gap:0; }

    /* ── HERO ── */
    .profile-hero {
      width:100%; max-width:680px; margin-bottom:28px;
      background: linear-gradient(145deg, #110202, #0a0101);
      border: 1px solid rgba(232,25,44,0.20); border-radius:28px;
      padding: 40px 36px 36px; position:relative; overflow:hidden;
      box-shadow: 0 20px 60px rgba(0,0,0,0.5);
    }
    .profile-hero::before {
      content:''; position:absolute; top:0; left:0; right:0; height:2px;
      background:linear-gradient(90deg, transparent, #e8192c, transparent);
    }
    /* glow bg */
    .profile-hero::after {
      content:''; position:absolute; top:-60px; left:50%; transform:translateX(-50%);
      width:300px; height:200px;
      background:radial-gradient(ellipse, rgba(232,25,44,0.12) 0%, transparent 70%);
      pointer-events:none;
    }
    .hero-inner { position:relative; z-index:1; display:flex; align-items:center; gap:28px; }

    /* Avatar */
    .avatar-wrap { position:relative; flex-shrink:0; cursor:pointer; }
    .avatar-circle {
      width:90px; height:90px; border-radius:50%;
      background:linear-gradient(135deg, #e8192c, #6b0010);
      display:flex; align-items:center; justify-content:center;
      font-size:36px; font-weight:800;
      box-shadow:0 0 0 3px rgba(232,25,44,0.30), 0 0 40px rgba(232,25,44,0.25);
      overflow:hidden; transition:box-shadow 0.2s;
      position:relative;
    }
    .avatar-circle img { width:100%; height:100%; object-fit:cover; border-radius:50%; }
    .avatar-wrap:hover .avatar-circle { box-shadow:0 0 0 3px rgba(232,25,44,0.6), 0 0 50px rgba(232,25,44,0.35); }
    .avatar-upload-hint {
      position:absolute; inset:0; border-radius:50%;
      background:rgba(0,0,0,0.55); display:flex; align-items:center; justify-content:center;
      opacity:0; transition:opacity 0.18s; pointer-events:none;
    }
    .avatar-wrap:hover .avatar-upload-hint { opacity:1; }
    .avatar-upload-hint svg { width:22px; height:22px; color:#fff; }
    #avatarInput { display:none; }

    .hero-info { flex:1; min-width:0; }
    .hero-name { font-size:28px; font-weight:800; letter-spacing:-0.02em; margin-bottom:4px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
    .hero-email { font-size:13px; color:rgba(255,255,255,0.4); margin-bottom:12px; }
    .hero-badges { display:flex; align-items:center; gap:8px; flex-wrap:wrap; }
    .badge {
      display:inline-flex; align-items:center; gap:5px;
      padding:4px 10px; border-radius:20px; font-size:12px; font-weight:700;
    }
    .badge-uid {
      background:rgba(232,25,44,0.12); border:1px solid rgba(232,25,44,0.25); color:#ff6677;
    }
    .badge-member {
      background:rgba(255,255,255,0.05); border:1px solid rgba(255,255,255,0.10); color:rgba(255,255,255,0.45);
    }

    /* ── CARDS ── */
    .profile-cards { width:100%; max-width:680px; display:flex; flex-direction:column; gap:16px; }

    .pcard {
      background:linear-gradient(145deg,#0f0202,#090101);
      border:1px solid rgba(232,25,44,0.15); border-radius:20px; overflow:hidden;
    }
    .pcard-header {
      padding:18px 24px 0; display:flex; align-items:center; gap:8px;
    }
    .pcard-header-icon {
      width:30px; height:30px; border-radius:8px;
      background:rgba(232,25,44,0.12); border:1px solid rgba(232,25,44,0.20);
      display:flex; align-items:center; justify-content:center; flex-shrink:0;
    }
    .pcard-header-icon svg { width:14px; height:14px; color:#ff6677; }
    .pcard-title { font-size:13px; font-weight:700; color:rgba(255,255,255,0.7); }
    .pcard-body { padding:16px 24px 22px; }

    .form-row { display:grid; grid-template-columns:1fr 1fr; gap:14px; }
    .form-field { display:flex; flex-direction:column; gap:6px; }
    .form-field.full { grid-column:1/-1; }
    .form-field label { font-size:11px; font-weight:700; color:rgba(255,255,255,0.4); letter-spacing:0.06em; text-transform:uppercase; }
    .form-field input {
      padding:11px 14px; border-radius:12px;
      border:1px solid rgba(232,25,44,0.15); background:rgba(255,255,255,0.04);
      color:#fff; font-size:14px; font-family:inherit; outline:none;
      transition:border-color 0.2s, background 0.2s;
    }
    .form-field input:focus { border-color:rgba(232,25,44,0.5); background:rgba(232,25,44,0.04); }
    .form-field input:disabled { color:rgba(255,255,255,0.25); cursor:not-allowed; border-color:rgba(255,255,255,0.06); }
    .form-field input::placeholder { color:rgba(255,255,255,0.18); }

    .card-footer { display:flex; align-items:center; gap:12px; margin-top:18px; }
    .btn-primary {
      padding:10px 22px; border-radius:12px; border:none; cursor:pointer;
      background:linear-gradient(135deg,#e8192c,#9b0010); color:#fff;
      font-size:13px; font-weight:700; font-family:inherit;
      box-shadow:0 4px 14px rgba(232,25,44,0.3); transition:opacity 0.15s,transform 0.15s;
    }
    .btn-primary:hover { opacity:0.85; transform:translateY(-1px); }
    .btn-primary:disabled { opacity:0.45; cursor:not-allowed; transform:none; }
    .status-msg { font-size:13px; display:none; }
    .status-msg.ok { color:#4ade80; }
    .status-msg.err { color:#ff6677; }

    .btn-signout {
      width:100%; padding:12px 18px; border-radius:12px;
      border:1px solid rgba(232,25,44,0.20); background:transparent;
      color:rgba(255,255,255,0.55); cursor:pointer; font-size:14px; font-weight:600;
      font-family:inherit; display:flex; align-items:center; gap:10px;
      transition:background 0.15s, color 0.15s, border-color 0.15s;
    }
    .btn-signout:hover { background:rgba(232,25,44,0.10); color:#fff; border-color:rgba(232,25,44,0.35); }

    /* upload progress */
    .upload-bar-wrap { height:3px; background:rgba(232,25,44,0.12); border-radius:2px; margin-top:10px; overflow:hidden; display:none; }
    .upload-bar { height:100%; background:linear-gradient(90deg,#e8192c,#ff6677); border-radius:2px; width:0%; transition:width 0.3s; }

    @keyframes navSlideDown { from{opacity:0;transform:translateX(-50%) translateY(-20px)} to{opacity:1;transform:translateX(-50%) translateY(0)} }
    nav { animation:navSlideDown 0.55s cubic-bezier(.22,1,.36,1) both; }
    @keyframes fadeUp { from{opacity:0;transform:translateY(20px)} to{opacity:1;transform:none} }
    .anim { opacity:0; }
    .anim.visible { animation:fadeUp 0.5s cubic-bezier(.22,1,.36,1) both; }
  </style>
</head>

<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
<script>
  firebase.initializeApp({
    apiKey: "AIzaSyDlHPmsc1z0XVQ8XALZZAfuDAf04IfWKls",
    authDomain: "note-client-2017b.firebaseapp.com",
    databaseURL: "https://note-client-2017b-default-rtdb.firebaseio.com",
    projectId: "note-client-2017b",
    storageBucket: "note-client-2017b.firebasestorage.app",
    messagingSenderId: "387409651145",
    appId: "1:387409651145:web:c22642b42360ab25b77418"
  });
  const auth = firebase.auth();
  const db   = firebase.database();

  // ── Assign sequential user number ──
  async function ensureUserNumber(uid) {
    const userRef = db.ref('users/' + uid);
    const snap = await userRef.once('value');
    if (snap.exists() && snap.val().userNumber) return snap.val().userNumber;
    // Atomically increment counter
    const counterRef = db.ref('meta/userCount');
    let num;
    await counterRef.transaction(cur => { num = (cur || 0) + 1; return num; });
    await userRef.update({ userNumber: num, uid });
    return num;
  }

  function padNum(n) { return 'UID ' + n; }

  function setNavUser(user, photoURL) {
    const navActions = document.getElementById('navActions');
    navActions.querySelectorAll('.btn-user').forEach(el => el.remove());
    const name = user.displayName || user.email.split('@')[0];
    const initial = name[0].toUpperCase();
    const btn = document.createElement('a');
    btn.href = '/profile'; btn.className = 'btn-user';
    if (photoURL) {
      btn.innerHTML = `<div class="user-initial-nav"><img src="${photoURL}" alt=""/></div>${name}`;
    } else {
      btn.innerHTML = `<div class="user-initial-nav">${initial}</div>${name}`;
    }
    navActions.appendChild(btn);
  }

  auth.onAuthStateChanged(async user => {
    document.getElementById('loadingScreen').style.display = 'none';
    if (!user) { window.location.href = '/'; return; }

    // Load user data from DB
    const userSnap = await db.ref('users/' + user.uid).once('value');
    const userData = userSnap.val() || {};
    const photoURL = userData.photoURL || user.photoURL || null;
    const userNumber = await ensureUserNumber(user.uid);
    const name = user.displayName || user.email.split('@')[0];
    const joinDate = user.metadata.creationTime
      ? new Date(user.metadata.creationTime).toLocaleDateString('en-US', {month:'short', year:'numeric'})
      : '—';

    // Fill UI
    document.getElementById('profilePage').style.display = 'flex';
    setNavUser(user, photoURL);

    // Avatar
    if (photoURL) {
      document.getElementById('avatarCircle').innerHTML = `<img src="${photoURL}" alt=""/>`;
    } else {
      document.getElementById('avatarInitial').textContent = name[0].toUpperCase();
    }

    document.getElementById('heroName').textContent = name;
    document.getElementById('heroEmail').textContent = user.email;
    document.getElementById('badgeUid').innerHTML = `<svg width="10" height="10" viewBox="0 0 12 12" fill="currentColor"><path d="M6 1a5 5 0 1 0 0 10A5 5 0 0 0 6 1zm0 1.5a1.5 1.5 0 1 1 0 3 1.5 1.5 0 0 1 0-3zm0 7a3.5 3.5 0 0 1-2.9-1.55C3.1 7.42 5 6.75 6 6.75s2.9.67 2.9 1.2A3.5 3.5 0 0 1 6 9.5z"/></svg>${padNum(userNumber)}`;
    document.getElementById('badgeMember').innerHTML = `<svg width="10" height="10" viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="1" y="2" width="10" height="8" rx="1.5"/><path d="M1 5h10"/><path d="M4 2v3"/><path d="M8 2v3"/></svg>Member since ${joinDate}`;

    document.getElementById('inputName').value = user.displayName || '';
    document.getElementById('inputEmail').value = user.email;

    // Animate
    document.querySelectorAll('.anim').forEach((el, i) => {
      el.style.animationDelay = (i * 0.07) + 's';
      el.classList.add('visible');
    });
  });

  // ── Avatar upload ──
  document.getElementById('avatarInput').addEventListener('change', async e => {
    const file = e.target.files[0];
    if (!file) return;
    if (file.size > 5 * 1024 * 1024) { alert('Image too large (max 5 MB)'); return; }

    const barWrap = document.getElementById('uploadBarWrap');
    const bar     = document.getElementById('uploadBar');
    barWrap.style.display = 'block';
    bar.style.width = '20%';

    // Compress via canvas
    const img = new Image();
    const reader = new FileReader();
    reader.onload = ev => {
      img.src = ev.target.result;
      img.onload = async () => {
        const canvas = document.createElement('canvas');
        const MAX = 200;
        const ratio = Math.min(MAX/img.width, MAX/img.height);
        canvas.width  = img.width  * ratio;
        canvas.height = img.height * ratio;
        canvas.getContext('2d').drawImage(img, 0, 0, canvas.width, canvas.height);
        const dataURL = canvas.toDataURL('image/jpeg', 0.82);
        bar.style.width = '60%';

        try {
          const user = auth.currentUser;
          // Store in Firebase DB
          await db.ref('users/' + user.uid).update({ photoURL: dataURL });
          // Update display
          document.getElementById('avatarCircle').innerHTML = `<img src="${dataURL}" alt=""/>`;
          setNavUser(user, dataURL);
          bar.style.width = '100%';
          setTimeout(() => { barWrap.style.display = 'none'; bar.style.width = '0%'; }, 600);
        } catch(err) {
          alert('Upload failed. Try again.');
          barWrap.style.display = 'none';
        }
      };
    };
    reader.readAsDataURL(file);
  });

  // ── Save username ──
  document.getElementById('btnSaveName').addEventListener('click', async () => {
    const name = document.getElementById('inputName').value.trim();
    const msg  = document.getElementById('msgName');
    const btn  = document.getElementById('btnSaveName');
    if (!name) { showMsg(msg, 'Enter a username.', true); return; }
    btn.disabled = true; btn.textContent = 'Saving...';
    try {
      await auth.currentUser.updateProfile({ displayName: name });
      document.getElementById('heroName').textContent = name;
      document.getElementById('avatarInitial').textContent = name[0].toUpperCase();
      const photoURL = (await db.ref('users/' + auth.currentUser.uid + '/photoURL').once('value')).val();
      setNavUser(auth.currentUser, photoURL);
      showMsg(msg, 'Saved!', false);
    } catch(e) { showMsg(msg, 'Error. Try again.', true); }
    btn.disabled = false; btn.textContent = 'Save changes';
  });

  // ── Change password ──
  document.getElementById('btnSavePass').addEventListener('click', async () => {
    const np  = document.getElementById('inputNewPass').value;
    const cp  = document.getElementById('inputConfirmPass').value;
    const msg = document.getElementById('msgPass');
    const btn = document.getElementById('btnSavePass');
    if (!np) { showMsg(msg, 'Enter a new password.', true); return; }
    if (np !== cp) { showMsg(msg, "Passwords don't match.", true); return; }
    if (np.length < 6) { showMsg(msg, 'At least 6 characters.', true); return; }
    btn.disabled = true; btn.textContent = 'Updating...';
    try {
      await auth.currentUser.updatePassword(np);
      document.getElementById('inputNewPass').value = '';
      document.getElementById('inputConfirmPass').value = '';
      showMsg(msg, 'Password updated!', false);
    } catch(e) {
      const m = { 'auth/requires-recent-login': 'Sign out and sign in again first.', 'auth/weak-password': 'Min 6 characters.' };
      showMsg(msg, m[e.code] || 'Error. Try again.', true);
    }
    btn.disabled = false; btn.textContent = 'Update password';
  });

  // ── Sign out ──
  document.getElementById('btnSignOut').addEventListener('click', async () => {
    await auth.signOut();
    window.location.href = '/';
  });

  function showMsg(el, text, isErr) {
    el.textContent = text;
    el.className = 'status-msg ' + (isErr ? 'err' : 'ok');
    el.style.display = 'block';
    setTimeout(() => { el.style.display = 'none'; }, 3500);
  }

  // Theme
  document.getElementById('themeToggle').addEventListener('click', () => {
    const dark = document.documentElement.getAttribute('data-theme') !== 'dark';
    document.documentElement.setAttribute('data-theme', dark ? 'dark' : 'light');
    document.getElementById('togSun').classList.toggle('active', !dark);
    document.getElementById('togMoon').classList.toggle('active', dark);
  });
  document.getElementById('togMoon').classList.add('active');
</script>

<script>
  (function() {
    const wrap = document.createElement('div');
    wrap.style.cssText = 'will-change:transform;position:relative;';
    while (document.body.firstChild) wrap.appendChild(document.body.firstChild);
    document.body.appendChild(wrap);
    const navbar = wrap.querySelector('nav');
    if (navbar) document.body.insertBefore(navbar, wrap);
    const loading = wrap.querySelector('#loadingScreen');
    if (loading) document.body.appendChild(loading);
    document.body.style.overflow = 'hidden';
    document.body.style.height = '100vh';
    let cur = 0, dst = 0;
    const EASE = 0.045;
    const maxScroll = () => wrap.scrollHeight - window.innerHeight;
    window.addEventListener('wheel', e => { dst = Math.min(Math.max(dst + e.deltaY, 0), maxScroll()); }, { passive: true });
    let ty = 0;
    window.addEventListener('touchstart', e => { ty = e.touches[0].clientY; }, { passive: true });
    window.addEventListener('touchmove', e => { dst = Math.min(Math.max(dst+(ty-e.touches[0].clientY)*1.5,0),maxScroll()); ty=e.touches[0].clientY; }, { passive: true });
    (function loop() {
      cur += (dst-cur)*EASE; if(Math.abs(dst-cur)<0.5)cur=dst;
      wrap.style.transform=`translateY(${-cur}px)`; requestAnimationFrame(loop);
    })();
  })();
</script>
</body>
