<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Note — Support</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Nunito+Sans:wght@400;500;600;700;800;900&family=Josefin+Sans:wght@300;400&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root { --accent: #e8192c; }
    html, body {
      min-height: 100%; background: #040000;
      font-family: 'Nunito Sans', 'Segoe UI', system-ui, sans-serif; color: #fff;
    }
    nav {
      position: fixed; top: 16px; left: 50%; transform: translateX(-50%);
      z-index: 100; display: flex; align-items: center; padding: 5px 6px;
      background: rgba(8,2,2,0.88); border: 1px solid rgba(232,25,44,0.20);
      border-radius: 50px; backdrop-filter: blur(24px); white-space: nowrap;
      box-shadow: 0 2px 24px rgba(0,0,0,0.5), inset 0 1px 0 rgba(255,255,255,0.04); gap: 0;
    }
    .nav-logo {
      display: flex; align-items: center; gap: 8px;
      font-family: 'Josefin Sans', sans-serif; font-weight: 700; font-size: 15px; letter-spacing: 0.04em;
      text-decoration: none; padding: 3px 12px 3px 4px;
      background: linear-gradient(180deg, #fff 0%, #ff8899 100%);
      -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text;
    }
    .nav-logo-icon {
      width: 34px; height: 34px;
      background: radial-gradient(circle at 40% 35%, #2a0008 0%, #0d0002 100%);
      border-radius: 10px; display: flex; align-items: center; justify-content: center;
      flex-shrink: 0; border: 1px solid rgba(232,25,44,0.35);
      box-shadow: 0 0 12px rgba(232,25,44,0.5), 0 0 32px rgba(232,25,44,0.2);
      position: relative; overflow: hidden;
    }
    .nav-logo-icon::after {
      content: ''; position: absolute; top: -8px; left: 50%;
      transform: translateX(-50%); width: 20px; height: 20px;
      background: radial-gradient(circle, rgba(232,25,44,0.6), transparent 70%); pointer-events: none;
    }
    .nav-logo-icon svg { width: 22px; height: 22px; position: relative; z-index: 1; }
    .nav-sep { width: 1px; height: 16px; background: rgba(232,25,44,0.20); margin: 0 4px; flex-shrink: 0; }
    .nav-links { display: flex; align-items: center; list-style: none; gap: 1px; }
    .nav-links a {
      display: flex; align-items: center; gap: 5px; padding: 6px 11px; border-radius: 50px;
      font-size: 13px; font-weight: 500; color: rgba(255,255,255,0.60); text-decoration: none;
      transition: background 0.15s, color 0.15s; line-height: 1;
    }
    .nav-links a:hover { background: rgba(232,25,44,0.12); color: #fff; }
    .nav-links a.active { background: rgba(232,25,44,0.16); color: #fff; font-weight: 600; }
    .nav-links a .nav-icon { width: 14px; height: 14px; opacity: 0.80; flex-shrink: 0; }
    .nav-actions { display: flex; align-items: center; gap: 5px; margin-left: 2px; }
    .theme-toggle-pill {
      display: flex; align-items: center; background: rgba(232,25,44,0.08);
      border: 1px solid rgba(232,25,44,0.16); border-radius: 50px; padding: 3px 4px; gap: 1px; cursor: pointer;
    }
    .tog-icon {
      width: 24px; height: 24px; border-radius: 50%; display: flex; align-items: center; justify-content: center;
      font-size: 12px; color: rgba(255,255,255,0.35); transition: background 0.18s, color 0.18s; user-select: none;
    }
    .tog-icon.active { background: rgba(232,25,44,0.28); color: #fff; }
    .btn-signin {
      display: flex; align-items: center; gap: 6px; padding: 6px 14px 6px 11px; border-radius: 50px;
      background: #e8192c; color: #fff; font-size: 13px; font-weight: 600;
      border: 1px solid rgba(255,80,80,0.3); cursor: pointer; text-decoration: none;
      transition: background 0.15s; line-height: 1; box-shadow: 0 2px 12px rgba(232,25,44,0.4);
    }
    .btn-signin:hover { background: #c5101f; }
    .signin-icon { width: 15px; height: 15px; opacity: 0.80; flex-shrink: 0; }

    .support-page {
      min-height: 100vh; display: flex; flex-direction: column;
      align-items: center; padding: 100px 24px 60px;
    }
    .page-header { text-align: center; margin-bottom: 32px; }
    .section-tag {
      display: inline-flex; align-items: center; gap: 6px;
      background: rgba(232,25,44,0.12); border: 1px solid rgba(232,25,44,0.25);
      color: #ff4455; font-size: 12px; font-weight: 700;
      letter-spacing: 0.08em; text-transform: uppercase;
      padding: 5px 14px; border-radius: 100px; margin-bottom: 18px;
    }
    .page-title { font-size: clamp(28px,4vw,44px); font-weight: 800; letter-spacing: -0.02em; margin-bottom: 10px; }
    .page-sub { font-size: 15px; color: rgba(255,255,255,0.5); line-height: 1.6; }

    /* CHAT */
    .chat-window {
      width: 100%; max-width: 720px;
      background: #0a0101; border: 1px solid rgba(232,25,44,0.18);
      border-radius: 20px; overflow: hidden;
      box-shadow: 0 8px 48px rgba(0,0,0,0.5);
      display: flex; flex-direction: column; height: 520px;
    }
    .chat-header {
      display: flex; align-items: center; gap: 12px; padding: 14px 18px;
      background: #0d0202; border-bottom: 1px solid rgba(232,25,44,0.14); flex-shrink: 0;
    }
    .chat-header-dots { display: flex; gap: 6px; }
    .chat-header-dots span { width: 10px; height: 10px; border-radius: 50%; }
    .dot-r { background: #ff5f57; } .dot-y { background: #febc2e; } .dot-g { background: #28c840; }
    .support-avatar {
      width: 36px; height: 36px; border-radius: 50%;
      background: linear-gradient(135deg, #e8192c, #6b0010);
      display: flex; align-items: center; justify-content: center;
      font-size: 15px; font-weight: 700; flex-shrink: 0;
      box-shadow: 0 0 10px rgba(232,25,44,0.4);
    }
    .support-info { flex: 1; }
    .support-name { font-size: 14px; font-weight: 700; }
    .support-status { font-size: 12px; color: rgba(255,255,255,0.4); display: flex; align-items: center; gap: 5px; margin-top: 1px; }
    .status-dot { width: 7px; height: 7px; border-radius: 50%; background: #22c55e; box-shadow: 0 0 6px rgba(34,197,94,0.7); animation: pdot 2s ease-in-out infinite; }
    @keyframes pdot { 0%,100%{opacity:1} 50%{opacity:0.4} }

    .chat-messages {
      flex: 1; overflow-y: auto; padding: 18px 18px 8px;
      display: flex; flex-direction: column; gap: 8px; scroll-behavior: smooth;
    }
    .chat-messages::-webkit-scrollbar { width: 4px; }
    .chat-messages::-webkit-scrollbar-thumb { background: rgba(232,25,44,0.2); border-radius: 2px; }

    .date-div { display: flex; align-items: center; gap: 10px; font-size: 11px; color: rgba(255,255,255,0.25); margin: 4px 0; }
    .date-div::before, .date-div::after { content:''; flex:1; height:1px; background:rgba(255,255,255,0.07); }

    .msg { display: flex; align-items: flex-end; gap: 8px; max-width: 78%; }
    .msg.from-user { align-self: flex-end; flex-direction: row-reverse; }
    .msg.from-admin { align-self: flex-start; }
    .msg-avatar {
      width: 26px; height: 26px; border-radius: 50%; flex-shrink: 0;
      background: linear-gradient(135deg, #e8192c, #6b0010);
      display: flex; align-items: center; justify-content: center; font-size: 11px; font-weight: 700;
    }
    .msg-bubble {
      padding: 9px 13px; border-radius: 17px; font-size: 14px; line-height: 1.5;
      animation: msgIn 0.22s cubic-bezier(.22,1,.36,1) both;
    }
    @keyframes msgIn { from{opacity:0;transform:translateY(6px) scale(0.97)} to{opacity:1;transform:none} }
    .msg.from-admin .msg-bubble {
      background: #181010; border: 1px solid rgba(232,25,44,0.15);
      border-bottom-left-radius: 4px; color: rgba(255,255,255,0.88);
    }
    .msg.from-user .msg-bubble {
      background: linear-gradient(135deg, #e8192c, #9b0010);
      border-bottom-right-radius: 4px; color: #fff;
      box-shadow: 0 2px 10px rgba(232,25,44,0.3);
    }
    .msg-time { font-size: 10px; color: rgba(255,255,255,0.25); margin-top: 2px; padding: 0 3px; }
    .msg.from-user .msg-time { text-align: right; }

    .typing-indicator { display: none; align-items: flex-end; gap: 8px; align-self: flex-start; }
    .typing-indicator.show { display: flex; }
    .typing-bubble {
      background: #181010; border: 1px solid rgba(232,25,44,0.15);
      border-radius: 17px; border-bottom-left-radius: 4px;
      padding: 11px 14px; display: flex; align-items: center; gap: 4px;
    }
    .tdot { width: 6px; height: 6px; border-radius: 50%; background: rgba(255,255,255,0.35); animation: td 1.2s ease-in-out infinite; }
    .tdot:nth-child(2){animation-delay:.2s} .tdot:nth-child(3){animation-delay:.4s}
    @keyframes td { 0%,80%,100%{transform:scale(1);opacity:.35} 40%{transform:scale(1.3);opacity:1} }

    .chat-input-bar {
      padding: 10px 14px; background: #0d0202;
      border-top: 1px solid rgba(232,25,44,0.12);
      display: flex; align-items: flex-end; gap: 8px; flex-shrink: 0;
    }
    .chat-input {
      flex: 1; background: rgba(255,255,255,0.05); border: 1px solid rgba(232,25,44,0.18);
      border-radius: 20px; padding: 9px 14px; color: #fff; font-size: 14px;
      font-family: inherit; outline: none; resize: none; max-height: 100px; line-height: 1.5;
      transition: border-color 0.15s;
    }
    .chat-input::placeholder { color: rgba(255,255,255,0.27); }
    .chat-input:focus { border-color: rgba(232,25,44,0.4); }
    .chat-send {
      width: 38px; height: 38px; border-radius: 50%;
      background: linear-gradient(135deg, #e8192c, #8b0000); border: none; cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      box-shadow: 0 2px 10px rgba(232,25,44,0.35); transition: opacity 0.15s, transform 0.15s; flex-shrink: 0;
    }
    .chat-send:hover { opacity: 0.85; transform: scale(1.06); }
    .chat-send svg { width: 15px; height: 15px; color: #fff; }

    @keyframes navSlideDown { from{opacity:0;transform:translateX(-50%) translateY(-20px)} to{opacity:1;transform:translateX(-50%) translateY(0)} }
    nav { animation: navSlideDown 0.55s cubic-bezier(.22,1,.36,1) both; }
    @keyframes fadeUp { from{opacity:0;transform:translateY(22px)} to{opacity:1;transform:none} }
    .anim { opacity: 0; }
    .anim.visible { animation: fadeUp 0.6s cubic-bezier(.22,1,.36,1) both; }

    footer {
      background: #040000; border-top: 1px solid rgba(232,25,44,0.10);
      padding: 28px 24px; margin-top: 40px;
      display: flex; flex-direction: column; align-items: center; gap: 12px; width: 100%;
    }
    .footer-links { display: flex; gap: 24px; }
    .footer-links a { color: rgba(255,255,255,0.35); text-decoration: none; font-size: 13px; transition: color 0.15s; }
    .footer-links a:hover { color: #fff; }
    footer p { font-size: 12px; color: rgba(255,255,255,0.2); }
  </style>
</head>

  <!-- Firebase -->
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
  <script>
    // Firebase init
    firebase.initializeApp({
      apiKey: "AIzaSyDlHPmsc1z0XVQ8XALZZAfuDAf04IfWKls",
      authDomain: "note-client-2017b.firebaseapp.com",
      databaseURL: "https://note-client-2017b-default-rtdb.firebaseio.com",
      projectId: "note-client-2017b",
      storageBucket: "note-client-2017b.firebasestorage.app",
      messagingSenderId: "387409651145",
      appId: "1:387409651145:web:c22642b42360ab25b77418"
    });
    const db = firebase.database();

    // Session ID (unique per browser)
    let sessionId = localStorage.getItem('note_session');
    if (!sessionId) {
      sessionId = 'session_' + Date.now() + '_' + Math.random().toString(36).slice(2, 8);
      localStorage.setItem('note_session', sessionId);
    }

    const messagesEl = document.getElementById('chatMessages');
    const inputEl    = document.getElementById('chatInput');
    const sendBtn    = document.getElementById('chatSend');
    const typingEl   = document.getElementById('typingEl');

    function getTime() {
      const d = new Date();
      return d.getHours().toString().padStart(2,'0') + ':' + d.getMinutes().toString().padStart(2,'0');
    }

    function scrollBottom() { messagesEl.scrollTop = messagesEl.scrollHeight; }

    // Render message from Firebase
    function renderMsg(data) {
      const isUser = data.from === 'user';
      const msg = document.createElement('div');
      msg.className = 'msg ' + (isUser ? 'from-user' : 'from-admin');
      if (isUser) {
        msg.innerHTML = `<div><div class="msg-bubble">${escHtml(data.text)}</div><div class="msg-time">${data.time||''}</div></div>`;
      } else {
        msg.innerHTML = `<div class="msg-avatar">N</div><div><div class="msg-bubble">${escHtml(data.text)}</div><div class="msg-time">${data.time||''}</div></div>`;
      }
      messagesEl.insertBefore(msg, typingEl);
      scrollBottom();
    }

    function escHtml(t) {
      return t.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
    }

    // Listen to messages in real time
    db.ref('chats/' + sessionId + '/messages').on('child_added', snap => {
      renderMsg(snap.val());
    });

    // Listen for admin typing indicator
    db.ref('chats/' + sessionId + '/adminTyping').on('value', snap => {
      if (snap.val()) typingEl.classList.add('show');
      else typingEl.classList.remove('show');
      scrollBottom();
    });

    // Send message
    function sendMessage() {
      const text = inputEl.value.trim();
      if (!text) return;
      inputEl.value = '';
      inputEl.style.height = 'auto';

      // Save session info for admin
      db.ref('chats/' + sessionId + '/info').set({
        sessionId,
        lastMsg: text,
        lastTime: Date.now(),
        unread: true
      });

      db.ref('chats/' + sessionId + '/messages').push({
        text, from: 'user', time: getTime(), ts: Date.now()
      });
    }

    sendBtn.addEventListener('click', sendMessage);
    inputEl.addEventListener('keydown', e => {
      if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendMessage(); }
    });
    inputEl.addEventListener('input', () => {
      inputEl.style.height = 'auto';
      inputEl.style.height = Math.min(inputEl.scrollHeight, 100) + 'px';
    });

    // Theme toggle
    const pill = document.querySelector('.theme-toggle-pill');
    function setTheme(dark) {
      document.documentElement.setAttribute('data-theme', dark ? 'dark' : 'light');
      document.getElementById('togSun').classList.toggle('active', !dark);
      document.getElementById('togMoon').classList.toggle('active', dark);
    }
    pill.addEventListener('click', () => setTheme(document.documentElement.getAttribute('data-theme') !== 'dark'));
    setTheme(true);

    // Animations
    const anims = document.querySelectorAll('.anim');
    anims.forEach((el,i) => { el.style.animationDelay = (i*0.09)+'s'; });
    const io = new IntersectionObserver(entries => {
      entries.forEach(e => { if(e.isIntersecting){e.target.classList.add('visible');io.unobserve(e.target);} });
    }, { threshold: 0.05 });
    anims.forEach(el => io.observe(el));
  </script>
  <script>
    (function() {
      const wrap = document.createElement('div');
      wrap.style.cssText = 'will-change:transform;position:relative;';
      while (document.body.firstChild) wrap.appendChild(document.body.firstChild);
      document.body.appendChild(wrap);
      const navbar = wrap.querySelector('nav');
      if (navbar) document.body.insertBefore(navbar, wrap);
      document.body.style.overflow = 'hidden';
      document.body.style.height = '100vh';
      let cur = 0, dst = 0;
      const EASE = 0.045;
      const maxScroll = () => wrap.scrollHeight - window.innerHeight;
      window.addEventListener('wheel', e => { dst = Math.min(Math.max(dst + e.deltaY, 0), maxScroll()); }, { passive: true });
      let ty = 0;
      window.addEventListener('touchstart', e => { ty = e.touches[0].clientY; }, { passive: true });
      window.addEventListener('touchmove', e => { dst = Math.min(Math.max(dst+(ty-e.touches[0].clientY)*1.5,0),maxScroll()); ty=e.touches[0].clientY; }, { passive: true });
      window.addEventListener('keydown', e => {
        if (document.activeElement === document.getElementById('chatInput')) return;
        if (e.key==='ArrowDown') dst=Math.min(dst+80,maxScroll());
        if (e.key==='ArrowUp') dst=Math.max(dst-80,0);
      });
      document.querySelectorAll('a[href^="#"]').forEach(a => a.addEventListener('click', e => e.preventDefault()));
      (function loop() {
        cur += (dst-cur)*EASE; if(Math.abs(dst-cur)<0.5)cur=dst;
        wrap.style.transform=`translateY(${-cur}px)`; requestAnimationFrame(loop);
      })();
    })();
  </script>
</body>
</html>
